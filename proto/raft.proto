syntax = "proto3";

package raft;

option go_package = "raft-kv-store/proto";

enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0; // reserved internally for the Raft leadership NOOP
  PUT = 1;
  DELETE = 2;
}

message Command {
  CommandType type = 1;
  string key = 2;
  string value = 3;
}

message LogEntry {
  int32 term = 1;
  Command command = 2;
}

message RequestVoteRequest {
  int32 term = 1;
  int32 candidate_id = 2;
  int32 last_log_index = 3;
  int32 last_log_term = 4;
}

message RequestVoteResponse {
  int32 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  int32 term = 1;
  int32 leader_id = 2;
  int32 prev_log_index = 3;
  int32 prev_log_term = 4;
  repeated LogEntry entries = 5;
  int32 leader_commit = 6;
}

message AppendEntriesResponse {
  int32 term = 1;
  bool success = 2;
}

service RaftService {
  rpc RequestVote(RequestVoteRequest)
      returns (RequestVoteResponse);

  rpc AppendEntries(AppendEntriesRequest)
      returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest)
    returns (InstallSnapshotResponse);
}
message PutRequest {
  string key = 1;
  string value = 2;
}

message PutResponse {
  bool success = 1;
  string message = 2;
  string leader_address = 3;
}

message GetRequest {
  string key = 1;
}

message GetResponse {
  bool success = 1;
  string value = 2;
  string message = 3;
  string leader_address = 4;
}

message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
  string leader_address = 3;
}

service KVService {
  rpc Put(PutRequest) returns (PutResponse);
  rpc Get(GetRequest) returns (GetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
}
message BlockPeerRequest {
  int32 peer_id = 1;
}

message BlockPeerResponse {
  bool success = 1;
  string message = 2;
}

message UnblockPeerRequest {
  int32 peer_id = 1;
}

message UnblockPeerResponse {
  bool success = 1;
  string message = 2;
}

service AdminService {
  rpc BlockPeer(BlockPeerRequest)
      returns (BlockPeerResponse);

  rpc UnblockPeer(UnblockPeerRequest)
      returns (UnblockPeerResponse);
}
message InstallSnapshotRequest {
  int32 term = 1;
  int32 leader_id = 2;
  int32 last_included_index = 3;
  int32 last_included_term = 4;
  map<string, string> store = 5;
}

message InstallSnapshotResponse {
  int32 term = 1;
  bool success = 2;
}